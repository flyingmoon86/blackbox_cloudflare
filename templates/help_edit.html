{% extends 'base.html' %}
{% block title %}编辑帮助 · 黑匣子{% endblock %}
{% block content %}<section class="reading-page"><h1>编辑{{ '管理员' if audience == 'admin' else '队员' }}指南</h1>{% if error %}<p class="alert alert-warning">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ account_csrf() }}">{% for item in items %}<fieldset class="reading-card" id="item-{{ loop.index0 }}"><label class="form-label d-block">标题<input class="form-control" name="title_{{ loop.index0 }}" value="{{ item.title }}" maxlength="100" required></label><label class="form-label d-block">步骤（每行一步）<textarea class="form-control" name="body_{{ loop.index0 }}" rows="5" maxlength="20000">{{ item.body }}</textarea></label></fieldset>{% endfor %}<button class="btn btn-primary">保存帮助条目</button></form></section>{% endblock %}
