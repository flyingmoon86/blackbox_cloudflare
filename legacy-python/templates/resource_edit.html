{% extends 'base.html' %}
{% block title %}编辑资料 · 黑匣子{% endblock %}
{% block content %}<section class="reading-page"><h1>编辑资料与归类</h1>{% if error %}<div class="alert alert-warning">{{ error }}</div>{% endif %}<form method="post" class="reading-card"><input type="hidden" name="csrf_token" value="{{ account_csrf() }}"><label class="form-label" for="edit-resource-title">标题</label><input id="edit-resource-title" class="form-control mb-3" name="title" maxlength="100" value="{{ request.form.get('title', resource.title) }}" required><label class="form-label" for="edit-resource-type">类型</label><select class="form-select mb-3" id="edit-resource-type" name="res_type">{% for value, label in resource_types.items() %}<option value="{{ value }}" {% if request.form.get('res_type', resource.res_type) == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><label for="edit-resource-production" class="form-label">所属作品</label><select id="edit-resource-production" class="form-select mb-3" name="production_id"><option value="">参考资料（未归类）</option>{% for p in productions %}<option value="{{ p.id }}" {% if request.form.get('production_id', resource.production_id|string) == p.id|string %}selected{% endif %}>{{ p.title }}</option>{% endfor %}</select><label for="edit-resource-description" class="form-label">说明</label><textarea id="edit-resource-description" class="form-control mb-3" name="description" rows="4">{{ request.form.get('description', resource.description or '') }}</textarea><button class="btn btn-primary">保存</button> <a href="{{ url_for('resource_detail', res_id=resource.id) }}">返回资料</a></form></section>{% endblock %}
